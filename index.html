<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>بحر الألغاز</title>

<style>

:root{
    --main:#e94560;
    --bg:#1a1a2e;
    --accent:#16213e;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

body{
    background:var(--bg);
    color:white;
    font-family:sans-serif;
    overflow:hidden;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* شاشة البداية */

#splash{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:9999;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.logo{
    width:130px;
    height:130px;
    border-radius:25px;
    overflow:hidden;
    border:4px solid var(--main);
    margin-bottom:20px;

    animation:bounce 2s infinite;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }
}

.btn{
    background:var(--main);
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* الأعلى */

#topbar{
    height:60px;
    background:var(--accent);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    border-bottom:2px solid var(--main);
}

/* اللعبة */

#game{
    flex:1;

    display:flex;
    flex-direction:column;
    align-items:center;

    position:relative;
}

/* لوحة البازل */

#board{
    width:300px;
    height:300px;

    margin-top:15px;

    position:relative;

    background:#0f3460;

    border:4px solid var(--main);

    display:grid;

    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
}

.target{
    border:1px dashed rgba(255,255,255,0.2);
}

/* منطقة القطع */

#pieces-area{
    width:100%;
    height:260px;

    position:relative;

    overflow:visible;
}

/* قطع البازل */

.piece{

    width:100px;
    height:100px;

    position:absolute;

    background-size:300px 300px;
    background-repeat:no-repeat;

    cursor:grab;

    z-index:10;

    touch-action:none;

    box-shadow:
    0 5px 12px rgba(0,0,0,0.5);

    /* شكل البازل */

    clip-path:polygon(
        0% 0%,
        35% 0%,
        50% 10%,
        65% 0%,
        100% 0%,
        100% 35%,
        90% 50%,
        100% 65%,
        100% 100%,
        65% 100%,
        50% 90%,
        35% 100%,
        0% 100%,
        0% 65%,
        10% 50%,
        0% 35%
    );

}

/* زر التالي */

#next-btn{
    margin-top:10px;

    display:none;

    background:#2ecc71;
}

/* الفوز */

#winner{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.95);

    z-index:99999;

    display:none;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
}

</style>

</head>

<body>

<!-- الأصوات -->

<audio id="snapSound"
src="assets/audio/music.mp3">
</audio>

<audio id="winSound"
src="assets/audio/music.mp3">
</audio>

<!-- البداية -->

<div id="splash">

    <div class="logo">

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=300">

    </div>

    <h1 style="margin-bottom:20px;">

        بحر الألغاز

    </h1>

    <button class="btn"
    onclick="startGame()">

        ابدأ اللعبة

    </button>

</div>

<!-- الأعلى -->

<div id="topbar">

    <div id="levelText">

        المستوى: 1

    </div>

    <div id="timer">

        00:00

    </div>

</div>

<!-- اللعبة -->

<div id="game">

    <!-- البورد -->

    <div id="board">

        <div class="target"></div>
        <div class="target"></div>
        <div class="target"></div>

        <div class="target"></div>
        <div class="target"></div>
        <div class="target"></div>

        <div class="target"></div>
        <div class="target"></div>
        <div class="target"></div>

    </div>

    <!-- التالي -->

    <button id="next-btn"
    class="btn"
    onclick="nextLevel()">

        المستوى التالي

    </button>

    <!-- القطع -->

    <div id="pieces-area"></div>

</div>

<!-- الفوز -->

<div id="winner">

    <h1 style="font-size:45px; color:gold;">

        🏆 فزت 🏆

    </h1>

    <br>

    <button class="btn"
    onclick="location.reload()">

        العب مجددًا

    </button>

</div>

<script>

/* المتغيرات */

let level = 1;

let solved = 0;

let seconds = 0;

/* بدء اللعبة */

function startGame(){

    document
    .getElementById("splash")
    .style.display = "none";

    setInterval(()=>{

        seconds++;

        let m =
        Math.floor(seconds / 60);

        let s =
        seconds % 60;

        document
        .getElementById("timer")
        .innerText =
        `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

    },1000);

    loadLevel();
}

/* تحميل المستوى */

function loadLevel(){

    solved = 0;

    document
    .getElementById("next-btn")
    .style.display = "none";

    document
    .getElementById("levelText")
    .innerText =
    `المستوى: ${level}`;

    const area =
    document
    .getElementById("pieces-area");

    area.innerHTML = "";

    /* صورة ثابتة */

    const img =
    "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=300";

    for(let i=0;i<9;i++){

        const piece =
        document.createElement("div");

        piece.className = "piece";

        piece.dataset.id = i;

        let row =
        Math.floor(i / 3);

        let col =
        i % 3;

        piece.style.backgroundImage =
        `url(${img})`;

        piece.style.backgroundPosition =
        `-${col*100}px -${row*100}px`;

        piece.style.left =
        Math.random() *
        (window.innerWidth - 120)
        + "px";

        piece.style.top =
        Math.random() * 120
        + "px";

        makeDraggable(piece);

        area.appendChild(piece);
    }
}

/* السحب */

function makeDraggable(piece){

    let dragging = false;

    let offsetX = 0;

    let offsetY = 0;

    piece.addEventListener("pointerdown",(e)=>{

        dragging = true;

        offsetX =
        e.clientX - piece.offsetLeft;

        offsetY =
        e.clientY - piece.offsetTop;

        piece.style.zIndex = 999;
    });

    window.addEventListener("pointermove",(e)=>{

        if(!dragging) return;

        piece.style.left =
        (e.clientX - offsetX)
        + "px";

        piece.style.top =
        (e.clientY - offsetY - 60)
        + "px";
    });

    window.addEventListener("pointerup",()=>{

        if(!dragging) return;

        dragging = false;

        checkSnap(piece);
    });
}

/* الالتصاق */

function checkSnap(piece){

    const id =
    Number(piece.dataset.id);

    const targets =
    document.querySelectorAll(".target");

    const target =
    targets[id];

    const board =
    document
    .getElementById("board");

    const boardRect =
    board.getBoundingClientRect();

    const targetRect =
    target.getBoundingClientRect();

    const pieceRect =
    piece.getBoundingClientRect();

    const dx =
    Math.abs(
        pieceRect.left -
        targetRect.left
    );

    const dy =
    Math.abs(
        pieceRect.top -
        targetRect.top
    );

    if(dx < 40 && dy < 40){

        const x =
        target.offsetLeft;

        const y =
        target.offsetTop;

        piece.style.left =
        (board.offsetLeft + x)
        + "px";

        piece.style.top =
        (board.offsetTop + y)
        + "px";

        piece.style.pointerEvents =
        "none";

        piece.style.zIndex = 1;

        /* صوت */

        const snap =
        document
        .getElementById("snapSound");

        snap.currentTime = 0;

        snap.play();

        solved++;

        if(solved === 9){

            document
            .getElementById("next-btn")
            .style.display = "block";
        }
    }
}

/* المستوى التالي */

function nextLevel(){

    if(level >= 20){

        document
        .getElementById("winSound")
        .play();

        document
        .getElementById("winner")
        .style.display = "flex";

        return;
    }

    level++;

    loadLevel();
}

</script>

</body>

</html>
