```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

<title>بحر الألغاز</title>

<style>
:root{
    --main:#e94560;
    --bg:#1a1a2e;
    --accent:#16213e;
}

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

body{
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:white;
    font-family:sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* شاشة البداية */
#splash{
    position:fixed;
    inset:0;
    z-index:999;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.logo{
    width:120px;
    height:120px;
    border-radius:25px;
    overflow:hidden;
    border:4px solid var(--main);
    margin-bottom:20px;
    animation:bounce 2s infinite;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

.btn{
    background:var(--main);
    border:none;
    color:white;
    padding:14px 30px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* الواجهة */
#topbar{
    height:60px;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:2px solid var(--main);
}

#game{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

/* لوحة البازل */
#board{
    width:300px;
    height:300px;
    margin-top:15px;
    position:relative;
    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
    border:3px solid var(--main);
    background:#0f3460;
}

.target{
    border:1px dashed rgba(255,255,255,0.2);
}

/* منطقة القطع */
#pieces-area{
    width:100%;
    height:220px;
    position:relative;
    margin-top:10px;
    overflow:hidden;
}

/* القطع */
.piece{
    width:100px;
    height:100px;
    position:absolute;
    background-size:300px 300px;
    background-repeat:no-repeat;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
    touch-action:none;
}

/* زر التالي */
#next-btn{
    margin-top:10px;
    display:none;
    background:#2ecc71;
}

/* نافذة الفوز */
#winner{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    z-index:1000;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}
</style>
</head>

<body>

<!-- شاشة البداية -->
<div id="splash">

    <div class="logo">
        <img src="https://picsum.photos/200" />
    </div>

    <h1>بحر الألغاز</h1>

    <button class="btn" onclick="startGame()">
        ابدأ اللعبة
    </button>

</div>

<!-- الواجهة -->
<div id="topbar">

    <div id="level-text">المستوى: 1</div>

    <div id="timer">00:00</div>

</div>

<!-- اللعبة -->
<div id="game">

    <div id="board">
        <div class="target"></div>
        <div class="target"></div>
        <div class="target"></div>
        <div class="target"></div>
        <div class="target"></div>
        <div class="target"></div>
        <div class="target"></div>
        <div class="target"></div>
        <div class="target"></div>
    </div>

    <button id="next-btn" class="btn" onclick="nextLevel()">
        المستوى التالي
    </button>

    <div id="pieces-area"></div>

</div>

<!-- شاشة النهاية -->
<div id="winner">

    <h1>🏆 انتهت اللعبة 🏆</h1>

    <p>لقد أنهيت جميع المستويات</p>

    <button class="btn" onclick="location.reload()">
        العب مجددًا
    </button>

</div>

<script>

let level = 1;
let solved = 0;
let seconds = 0;

/* بدء اللعبة */
function startGame(){

    document.getElementById("splash").style.display = "none";

    setInterval(() => {

        seconds++;

        let m = Math.floor(seconds / 60);
        let s = seconds % 60;

        document.getElementById("timer").innerText =
            `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

    },1000);

    loadLevel();
}

/* تحميل مستوى */
function loadLevel(){

    solved = 0;

    document.getElementById("next-btn").style.display = "none";

    document.getElementById("level-text").innerText =
        `المستوى: ${level}`;

    const area = document.getElementById("pieces-area");

    area.innerHTML = "";

    /* صورة جديدة كل مستوى */
    const image =
        `https://picsum.photos/300?random=${level}`;

    for(let i=0;i<9;i++){

        const piece = document.createElement("div");

        piece.className = "piece";

        piece.dataset.id = i;

        const row = Math.floor(i / 3);
        const col = i % 3;

        piece.style.backgroundImage = `url(${image})`;

        piece.style.backgroundPosition =
            `-${col*100}px -${row*100}px`;

        piece.style.left =
            Math.random() * (window.innerWidth - 110) + "px";

        piece.style.top =
            Math.random() * 100 + "px";

        makeDraggable(piece);

        area.appendChild(piece);
    }
}

/* السحب */
function makeDraggable(piece){

    let offsetX = 0;
    let offsetY = 0;
    let dragging = false;

    piece.addEventListener("pointerdown",(e)=>{

        dragging = true;

        piece.setPointerCapture(e.pointerId);

        offsetX = e.clientX - piece.offsetLeft;
        offsetY = e.clientY - piece.offsetTop;

        piece.style.zIndex = 1000;
    });

    piece.addEventListener("pointermove",(e)=>{

        if(!dragging) return;

        piece.style.left =
            (e.clientX - offsetX) + "px";

        piece.style.top =
            (e.clientY - offsetY - 60) + "px";
    });

    piece.addEventListener("pointerup",()=>{

        dragging = false;

        checkSnap(piece);
    });
}

/* التحقق من مكان القطعة */
function checkSnap(piece){

    const id = Number(piece.dataset.id);

    const targets =
        document.querySelectorAll(".target");

    const target = targets[id];

    const tRect = target.getBoundingClientRect();

    const pRect = piece.getBoundingClientRect();

    const board =
        document.getElementById("board")
        .getBoundingClientRect();

    if(
        Math.abs(pRect.left - tRect.left) < 35 &&
        Math.abs(pRect.top - tRect.top) < 35
    ){

        piece.style.left =
            (tRect.left - board.left) + "px";

        piece.style.top =
            (tRect.top - board.top + 75) + "px";

        piece.style.pointerEvents = "none";

        piece.style.zIndex = 1;

        solved++;

        if(solved === 9){

            document.getElementById("next-btn")
            .style.display = "block";
        }
    }
}

/* المستوى التالي */
function nextLevel(){

    if(level >= 20){

        document.getElementById("winner")
        .style.display = "flex";

        return;
    }

    level++;

    loadLevel();
}

</script>

</body>
</html>
```
