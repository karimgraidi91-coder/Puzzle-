<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>بحر الألغاز - نسخة البازل الاحترافية</title>
    <!-- إعلانات جوجل التجريبية -->
    <script async src="https://googlesyndication.com" crossorigin="anonymous"></script>
    
    <style>
        :root { --main: #e94560; --bg: #1a1a2e; --accent: #16213e; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; touch-action: none; display: flex; flex-direction: column; height: 100vh; }
        
        /* شاشة البداية */
        #splash-screen { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo { width: 120px; height: 120px; background: white; border-radius: 25px; margin-bottom: 20px; animation: bounce 2s infinite; overflow: hidden; border: 3px solid var(--main); }
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* واجهة اللعبة */
        #ui { padding: 10px; display: flex; justify-content: space-between; background: var(--accent); align-items: center; z-index: 10; border-bottom: 2px solid var(--main); }
        #game-container { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; }
        #board { position: relative; width: 300px; height: 300px; background: rgba(15, 52, 96, 0.5); border: 2px dashed var(--main); margin: 10px auto; display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); }
        .target { width: 100px; height: 100px; }

        /* تصميم قطع البازل الحقيقية */
        .piece { 
            width: 120px; height: 120px; /* حجم أكبر قليلاً للسماح بالنتوءات */
            position: absolute; cursor: grab; 
            background-size: 300px 300px; 
            z-index: 10; 
            filter: drop-shadow(0px 4px 5px rgba(0,0,0,0.5));
        }

        /* أشكال قطع البازل (نتوءات دائرية) */
        .p-shape-0 { clip-path: path("M30,30 H70 Q85,30 85,15 T70,0 H30 Q15,0 15,15 T30,30 V70 Q30,85 15,85 T0,70 V30 Q0,15 15,15 T30,30 Z"); }
        .p-shape-1 { clip-path: path("M30,30 H70 Q85,30 85,45 T100,60 V90 H70 Q55,90 55,105 T70,120 H30 Q15,120 15,105 T30,90 V60 Q30,45 15,45 T0,30 Z"); }
        .p-shape-2 { clip-path: path("M30,0 H70 V30 Q85,30 85,45 T100,60 V90 H70 V120 H30 V90 Q15,90 15,75 T0,60 V30 H30 Z"); }

        /* أزرار */
        .btn { padding: 12px 30px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; background: var(--main); color: white; box-shadow: 0 4px #a32d41; }
        #next-btn { display: none; margin: 5px auto; background: #2ecc71; box-shadow: 0 4px #27ae60; }
        #mute-btn { background: none; border: 1px solid white; border-radius: 50%; width: 40px; height: 40px; color: white; }

        #pieces-area { width: 100%; height: 160px; background: rgba(255,255,255,0.05); position: relative; border-top: 2px solid var(--accent); }

        /* نافذة الفوز */
        #win-dialog { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="logo"><img src="assets/audio/icon.png"></div>
        <h1 style="color: var(--main);">بحر الألغاز</h1>
        <button class="btn" onclick="startGame()">ابدأ المغامرة</button>
    </div>

    <div id="ui">
        <div id="lvl-txt">المستوى: 1</div>
        <div id="timer-txt">00:00</div>
        <button id="mute-btn" onclick="toggleMute()">🔊</button>
    </div>

    <div id="game-container">
        <div id="board">
            <div class="target"></div><div class="target"></div><div class="target"></div>
            <div class="target"></div><div class="target"></div><div class="target"></div>
            <div class="target"></div><div class="target"></div><div class="target"></div>
        </div>
        <button id="next-btn" class="btn" onclick="goToNextLevel()">المستوى التالي ⮕</button>
        <div id="pieces-area"></div>
    </div>

    <div id="win-dialog">
        <h1 style="color: #f1c40f; font-size: 2.5rem;">🏆 أسطورة الألغاز! 🏆</h1>
        <p>لقد أنهيت 100 مستوى بنجاح</p>
        <button class="btn" onclick="location.reload()">العب مجدداً</button>
    </div>

    <audio id="bg-music" loop src="assets/audio/music.mp3"></audio>
    <audio id="pop-sound" src="https://google.com"></audio>
    <audio id="win-sound" src="https://myinstants.com"></audio>

    <script>
        let level = 1, solved = 0, seconds = 0, muted = false;

        function startGame() {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('bg-music').play().catch(() => {});
            setInterval(() => {
                seconds++;
                let m = Math.floor(seconds / 60), s = seconds % 60;
                document.getElementById('timer-txt').innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);
            loadLevel();
        }

        function loadLevel() {
            const area = document.getElementById('pieces-area');
            area.innerHTML = ""; solved = 0;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('lvl-txt').innerText = `المستوى: ${level}`;
            
            const img = `https://picsum.photos{level}`;

            for (let i = 0; i < 9; i++) {
                const p = document.createElement('div');
                // إعطاء أشكال مختلفة للقطع بشكل دوري
                p.className = `piece p-shape-${i % 3}`;
                p.style.backgroundImage = `url(${img})`;
                
                let r = Math.floor(i / 3), c = i % 3;
                // تعديل الخلفية لتناسب النتوءات
                p.style.backgroundPosition = `-${c * 100}px -${r * 100}px`;
                
                p.style.left = Math.random() * (window.innerWidth - 120) + 'px';
                p.style.top = Math.random() * 40 + 'px';
                
                makeDraggable(p, i);
                area.appendChild(p);
            }
        }

        function makeDraggable(el, id) {
            let drag = false;
            el.ontouchstart = () => { drag = true; el.style.zIndex = 100; };
            window.ontouchmove = (e) => {
                if (!drag) return;
                let t = e.touches[0];
                const container = document.getElementById('game-container').getBoundingClientRect();
                el.style.left = (t.clientX - 60) + 'px';
                el.style.top = (t.clientY - container.top - 150) + 'px';
            };
            window.ontouchend = () => { if (drag) { drag = false; checkSnap(el, id); } };
        }

        function checkSnap(el, id) {
            const targets = document.querySelectorAll('.target');
            const tRect = targets[id].getBoundingClientRect();
            const pRect = el.getBoundingClientRect();
            const container = document.getElementById('game-container').getBoundingClientRect();

            // منطق الالتصاق
            if (Math.abs(pRect.left - tRect.left) < 45 && Math.abs(pRect.top - tRect.top) < 45) {
                el.style.left = tRect.left + 'px';
                el.style.top = (tRect.top - container.top) + 'px';
                el.style.pointerEvents = 'none'; el.style.zIndex = 1;
                document.getElementById('pop-sound').play();
                solved++;
                if (solved === 9) document.getElementById('next-btn').style.display = 'block';
            }
        }

        function goToNextLevel() {
            if (level === 100) {
                document.getElementById('win-dialog').style.display = 'flex';
                document.getElementById('win-sound').play();
            } else {
                level++; loadLevel();
                if(level % 5 === 0) alert("إعلان مكافأة: استمتع بالمستوى التالي!");
            }
        }

        function toggleMute() {
            muted = !muted;
            document.getElementById('bg-music').muted = muted;
            document.getElementById('mute-btn').innerText = muted ? "🔇" : "🔊";
        }
    </script>
</body>
</html>
