name: Build APK
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.13.0'

      - name: Disable Flutter Analytics
        run: flutter --disable-telemetry # لتخطي رسالة الترحيب التي أوقفت البناء

      - name: Install dependencies
        run: flutter pub get
        working-directory: puzzle_game # الدخول للمجلد الصحيح تلقائياً

      - name: Build APK
        run: flutter build apk --debug
        working-directory: puzzle_game # الدخول للمجلد الصحيح تلقائياً

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-puzzle-game
          path: puzzle_game/build/app/outputs/flutter-apk/app-debug.apk
