name: Build APK
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Repair and Build
        run: |
          cd puzzle_game
          flutter config --no-analytics
          # حذف مجلد الأندرويد القديم وإعادة إنشائه بشكل سليم
          rm -rf android
          flutter create . --platforms android
          # تحميل المكتبات
          flutter pub get
          # بناء الـ APK
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-game-final
          path: puzzle_game/build/app/outputs/flutter-apk/app-debug.apk
