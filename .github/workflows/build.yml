name: Build Flutter APK

on:
  push:
    branches: [ "main" ] # سيعمل البناء عند كل "Push" لفرع main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0' # نفس إصدارك الحالي
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug # بناء نسخة تجريبية سريعة

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: puzzle-game-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
