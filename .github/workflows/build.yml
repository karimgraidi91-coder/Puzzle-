name: Build APK
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # أزلنا تحديد الإصدار ليأخذ أحدث نسخة مستقرة تلقائياً
          cache: true 

      - name: Install dependencies
        run: |
          flutter --disable-telemetry
          flutter pub get
        working-directory: puzzle_game

      - name: Build APK
        run: flutter build apk --debug
        working-directory: puzzle_game

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-game-final
          path: puzzle_game/build/app/outputs/flutter-apk/app-debug.apk
